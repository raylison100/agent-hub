services:
  # Modelo local do Agent Hub. Sobe com `docker compose up -d ollama`.
  # Puxe um modelo antes de usar: `docker compose exec ollama ollama pull qwen3:8b`.
  # GPU NVIDIA: some `-f docker-compose.gpu.yml` (o dev.sh faz isso sozinho).
  # Contexto de 8k com KV em q8_0 e o que cabe na VRAM de 6 GB junto do 8B.
  ollama:
    container_name: agent-hub-ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0

volumes:
  ollama:
    name: agent-hub-ollama
